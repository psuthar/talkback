name: Release Readiness

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Optional git base ref for manual diff comparison"
        required: false
        default: ""

# checks: write — publish "TalkBack PR Gate" (and any other Checks API steps) with success/neutral/failure.
# Branch protection: to gate on PASS vs WARN vs BLOCK semantics, require the check named **TalkBack PR Gate**
# (WARN = neutral). You may still require separate workflow/CI checks for tests and builds.
permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Enforcement policy: block_only (default) or warn_and_block (stricter).
  # Change to warn_and_block to block merges on WARN outcomes as well.
  READINESS_ENFORCEMENT_MODE: block_only

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    services:
      postgres:
        image: postgres:16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: talkback
          POSTGRES_PASSWORD: talkback
          POSTGRES_DB: talkback
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install readiness dependencies
        run: pip install -r ops/release-readiness/requirements.txt

      - name: Fetch refs for git diff
        run: git fetch --all --tags --prune || true

      - name: Determine base ref
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              echo "base_ref=$BEFORE" >> "$GITHUB_OUTPUT"
            else
              echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "${{ github.event.inputs.base_ref }}" ]; then
            echo "base_ref=${{ github.event.inputs.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: PR risk scoring (v2.8)
        id: prrisk
        continue-on-error: true
        run: |
          mkdir -p artifacts/release-readiness
          go run ./cmd/prrisk \
            --repo-root . \
            --base-ref "${{ steps.base.outputs.base_ref }}" \
            --output-dir artifacts/release-readiness

      - name: Run Go tests (smoke signal + coverage)
        id: gotest
        continue-on-error: true
        env:
          DATABASE_URL: postgres://talkback:talkback@localhost:5432/talkback?sslmode=disable
        run: go test ./... -count=1 -coverprofile=coverage.out

      # Go tests use a migrated DB (see internal/database/db_test.go). When tests pass, migrations are validated.
      # Release readiness requires explicit migrations_validated for internal/migrations/** (see ops/release-readiness/README.md).
      - name: Write smoke_results.json
        run: |
          if [ "${{ steps.gotest.outcome }}" = "success" ]; then
            echo '{"status":"passed","failed_count":0,"total_count":1,"validations":{"migrations_validated":true}}' > smoke_results.json
          else
            echo '{"status":"failed","failed_count":1,"total_count":1}' > smoke_results.json
          fi

      - name: Write coverage.json
        run: |
          if [ -f coverage.out ]; then
            TOTAL=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $NF}' | tr -d '%')
            BASELINE=$(python3 -c "import json; print(json.load(open('ops/release-readiness/coverage_baseline.json')).get('baseline_percent', 0))" 2>/dev/null || echo "0")
            echo "{\"line_percent\": $TOTAL, \"baseline_percent\": $BASELINE}" > coverage.json
          else
            echo '{"line_percent": 0, "baseline_percent": 0}' > coverage.json
          fi

      # ── E2E: Node + Playwright ──────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Install Playwright browsers (chromium + headless shell)
        working-directory: web
        run: npx playwright install chromium chromium-headless-shell --with-deps

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Serve frontend (background)
        working-directory: web
        run: |
          npm run preview -- --port 3000 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Frontend did not start within 15s" >&2
          exit 1

      - name: Install LibreOffice and poppler-utils (for PPTX conversion)
        run: sudo apt-get install -y --no-install-recommends libreoffice poppler-utils

      - name: Start API server (background)
        env:
          DATABASE_URL: postgres://talkback:talkback@localhost:5432/talkback?sslmode=disable
          PORT: "8081"
          RUN_MIGRATIONS: "true"
          STORAGE_DRIVER: local
          ENCRYPTION_KEY: ci-e2e-test-key-not-for-production
          ALLOW_DEV_RESET: "false"
          TALKBACK_BOOTSTRAP_ADMIN_EMAIL: "ci-admin@smoke.test"
          TALKBACK_BOOTSTRAP_ADMIN_PASSWORD: "SmokePass123!"
          TALKBACK_BOOTSTRAP_ADMIN_DISPLAY_NAME: "CI Admin"
        run: |
          go build -o api-ci ./cmd/api
          ./api-ci > api.log 2>&1 &
          echo $! > api-ci.pid

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
              echo "API is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy within 30s" >&2
          exit 1

      - name: Write prod_health.json
        run: |
          mkdir -p artifacts/release-readiness
          python - <<'PY'
          import json, urllib.request

          def get_json(url: str):
              with urllib.request.urlopen(url, timeout=10) as r:
                  return json.loads(r.read().decode("utf-8"))

          try:
              health = get_json("http://localhost:8081/health")
          except Exception as e:
              health = {"status": "error", "message": str(e)}

          try:
              db_ping = get_json("http://localhost:8081/db/ping")
          except Exception as e:
              db_ping = {"status": "error", "message": str(e)}

          payload = {
              "ok": True,  # Presence-only evidence for readiness scoring.
              "health": health,
              "db_ping": db_ping,
          }
          with open("artifacts/release-readiness/prod_health.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          print("Wrote artifacts/release-readiness/prod_health.json")
          PY

      - name: Sanity check frontend
        run: |
          curl -I --fail http://127.0.0.1:3000

      - name: Run Playwright E2E tests
        id: playwright
        timeout-minutes: 10
        continue-on-error: true
        working-directory: web
        env:
          CI: "true"
          TALKBACK_API_BASE: "http://localhost:8081"
          TALKBACK_ADMIN_EMAIL: "ci-admin@smoke.test"
          TALKBACK_ADMIN_PASSWORD: "SmokePass123!"
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee playwright-live.log

      - name: Convert Playwright results to readiness schema
        continue-on-error: true
        run: |
          test -f playwright-results.json
          python scripts/e2e_to_readiness.py \
            --input playwright-results.json \
            --output e2e_results.json

      - name: Stage E2E artifacts (JSON, HTML report, traces/screenshots)
        if: always()
        run: |
          mkdir -p artifacts/e2e-playwright
          for f in playwright-results.json e2e_results.json; do
            if [ -f "$f" ]; then cp -f "$f" artifacts/e2e-playwright/; fi
          done
          if [ -d web/playwright-report ]; then cp -R web/playwright-report artifacts/e2e-playwright/; fi
          if [ -d web/test-results ]; then cp -R web/test-results artifacts/e2e-playwright/; fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          def walk_failed_specs(node, file_hint=""):
              rows = []
              f = node.get("file") or file_hint
              for spec in node.get("specs", []):
                  sf = spec.get("file") or f
                  if spec.get("ok") is False:
                      rows.append((sf, spec.get("title", "")))
              for child in node.get("suites", []):
                  rows.extend(walk_failed_specs(child, f))
              return rows

          out = Path("artifacts/e2e-playwright/README.txt")
          lines = [
              "E2E artifact bundle (uploaded on every run; see release-readiness artifact).",
              "",
              "Files:",
              "  playwright-results.json — raw Playwright --reporter=json",
              "  e2e_results.json — readiness schema (scripts/e2e_to_readiness.py)",
              "  playwright-report/index.html — open locally after download",
              "  test-results/ — traces, screenshots (when failures/retries)",
              "",
          ]
          pr = Path("playwright-results.json")
          if pr.exists():
              try:
                  pw = json.loads(pr.read_text(encoding="utf-8"))
                  failed_specs = []
                  for root in pw.get("suites", []):
                      failed_specs.extend(walk_failed_specs(root))
                  if failed_specs:
                      lines.append("Failed specs (file + title from playwright-results.json):")
                      for fp, title in failed_specs:
                          lines.append(f"  - {fp}")
                          lines.append(f"    {title}")
                  else:
                      lines.append("Failed specs: (none with ok=false in JSON — see stats.unexpected or HTML report)")
              except Exception as e:
                  lines.append(f"(Could not parse playwright-results.json: {e})")
          else:
              lines.append("(playwright-results.json missing)")
          lines.append("")
          p = Path("e2e_results.json")
          if p.exists():
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  lines.append("Summary from e2e_results.json:")
                  lines.append(f"  status={d.get('status')}")
                  lines.append(f"  failed_count={d.get('failed_count')}")
                  lines.append(f"  total_count={d.get('total_count')}")
                  lines.append(f"  retries={d.get('retries')}")
                  fails = d.get("failures") or []
                  if fails:
                      lines.append("  failures[].title:")
                      for item in fails:
                          t = item.get("title") or item.get("name") or "?"
                          lines.append(f"    - {t}")
                  else:
                      lines.append("  failures: (empty)")
              except Exception as e:
                  lines.append(f"(Could not parse e2e_results.json: {e})")
          else:
              lines.append("(e2e_results.json missing — convert step may have failed.)")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload Playwright logs and artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-logs
          path: |
            playwright-results.json
            web/playwright-live.log
            web/playwright-report/
            web/test-results/
            api.log
          if-no-files-found: ignore

      - name: Run release readiness
        id: readiness
        continue-on-error: true
        shell: bash
        env:
          READINESS_ENFORCEMENT_MODE: ${{ env.READINESS_ENFORCEMENT_MODE }}
        run: |
          set -euo pipefail
          MIG_ARGS=()
          if [ "${{ steps.gotest.outcome }}" = "success" ]; then
            MIG_ARGS+=(--migration-validated)
          fi
          bash scripts/release-readiness.sh \
            --repo-root . \
            --config ops/release-readiness/config.yaml \
            --base-ref "${{ steps.base.outputs.base_ref }}" \
            --smoke-results smoke_results.json \
            --e2e-results e2e_results.json \
            --coverage coverage.json \
            --prod-health artifacts/release-readiness/prod_health.json \
            --output-dir artifacts/release-readiness \
            --enforcement-mode "${READINESS_ENFORCEMENT_MODE:-block_only}" \
            "${MIG_ARGS[@]}"

      - name: Evaluate Release Readiness Outcome
        id: evaluate
        if: always()
        shell: bash
        env:
          READINESS_ENFORCEMENT_MODE: ${{ env.READINESS_ENFORCEMENT_MODE }}
        run: |
          set -euo pipefail
          if [[ "${READINESS_FAILED:-}" == "true" ]]; then
            echo "::error::Release readiness execution failed"
            exit 1
          fi
          if [[ ! -f artifacts/release-readiness.json ]]; then
            echo "::error::artifacts/release-readiness.json missing"
            exit 1
          fi
          OUTCOME=$(jq -r '.outcome // empty' artifacts/release-readiness.json)
          echo "Outcome: $OUTCOME"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          MODE="${READINESS_ENFORCEMENT_MODE:-block_only}"
          if [[ "$OUTCOME" == "PASS" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OUTCOME" == "WARN" ]]; then
            echo "::warning::Release Readiness is WARN. Review report artifact."
            echo "status=warn" >> "$GITHUB_OUTPUT"
            if [[ "$MODE" == "warn_and_block" ]]; then
              echo "::error::Release Readiness is WARN and READINESS_ENFORCEMENT_MODE=warn_and_block."
              exit 1
            fi
            exit 0
          fi
          if [[ "$OUTCOME" == "BLOCK" ]]; then
            echo "::error::Release Readiness is BLOCK. Failing check."
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::error::Unknown outcome: $OUTCOME"
          exit 1

      # Combines PR Risk + Release Readiness into a single unified gate decision.
      # Runs before the PR risk semantic step so its section appears first in step summary.
      # continue-on-error: true so a script bug never blocks the rest of the workflow.
      - name: Compute PR gate summary
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/pr_gate.py \
            --pr-risk-json artifacts/pr-risk.json \
            --readiness-json artifacts/release-readiness.json \
            --readiness-report-json artifacts/release-readiness/report.json \
            --output-dir artifacts \
            --step-summary

      # Deterministic adapter: pr-gate-summary.json -> artifacts/pr-gate-check.json for GitHub Checks API.
      - name: Build PR gate GitHub Check payload
        if: always()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/pr_gate_check_payload.py \
            --gate-json artifacts/pr-gate-summary.json \
            --output artifacts/pr-gate-check.json

      # Verifies that normalize_action strips all taxonomy prefixes from the live pr-risk.json.
      # Catches new labels added to the Go engine before they reach user-facing output.
      - name: Smoke-check action normalization
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, sys
          sys.path.insert(0, 'scripts')
          from pr_gate import normalize_action

          path = 'artifacts/pr-risk.json'
          try:
              data = json.loads(open(path, encoding='utf-8').read())
          except Exception as e:
              print(f'Skipped: {path} not available ({e})')
              sys.exit(0)

          # A normalized action must not start with a single-word lowercase prefix followed by ": ".
          _leaking = re.compile(r'^[a-z]+:\s')
          validations = data.get('required_validations') or []
          issues = []
          for raw in validations:
              result = normalize_action(raw)
              if result and _leaking.match(result):
                  issues.append(f'  raw={raw!r} => {result!r}')

          if issues:
              print(f'FAIL: normalize_action left {len(issues)} prefix label(s) in output:')
              for i in issues:
                  print(i)
              sys.exit(1)
          else:
              print(f'OK: {len(validations)} required_validations normalized cleanly')
          PY

      # Maps merge_recommendation to Checks API conclusions (PASS→success, WARN→neutral, BLOCK→failure).
      # Does not use continue-on-error: the job must fail on BLOCK or generator/parsing errors.
      - name: Evaluate PR risk semantic result
        id: prrisk_semantic
        if: always()
        env:
          PRRISK_GEN_OUTCOME: ${{ steps.prrisk.outcome }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/evaluate_pr_risk_semantic.py \
            --pr-risk-json artifacts/pr-risk.json \
            --generator-outcome "$PRRISK_GEN_OUTCOME" \
            --semantic-json-out artifacts/pr-risk-semantic.json

      - name: Upload Release Readiness Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-readiness
          path: artifacts/
          if-no-files-found: warn

      - name: Publish TalkBack PR Gate check
        if: always()
        uses: actions/github-script@v8
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const ws = process.env.GITHUB_WORKSPACE;
            const checkPath = path.join(ws, 'artifacts/pr-gate-check.json');
            let payload;
            try {
              payload = JSON.parse(fs.readFileSync(checkPath, 'utf8'));
            } catch (e) {
              const runUrl = (process.env.GITHUB_RUN_URL || '').trim();
              payload = {
                check_name: 'TalkBack PR Gate',
                check_conclusion: 'failure',
                title: 'TalkBack PR Gate: error',
                summary: 'Could not read artifacts/pr-gate-check.json — ' + String(e),
                text: '### Error\n\n' + String(e) + (runUrl ? '\n\n' + runUrl : ''),
                details_url: runUrl || undefined,
              };
            }
            const headSha = context.payload.pull_request?.head?.sha || context.sha;
            const checkName = payload.check_name || 'TalkBack PR Gate';
            const runUrl = (process.env.GITHUB_RUN_URL || '').trim();
            if (runUrl && payload.summary && !payload.summary.includes(runUrl)) {
              payload.summary = (payload.summary || '') + '\n\n**Workflow run / artifacts:** ' + runUrl;
            }
            const { data: listed } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              check_name: checkName,
            });
            const runs = (listed.check_runs || []).slice().sort((a, b) => b.id - a.id);
            const output = {
              title: payload.title,
              summary: payload.summary || '',
              text: payload.text || '',
            };
            const common = {
              status: 'completed',
              conclusion: payload.check_conclusion,
              output,
            };
            if (payload.details_url) {
              common.details_url = payload.details_url;
            }
            if (runs.length > 0) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: runs[0].id,
                ...common,
              });
            } else {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: checkName,
                head_sha: headSha,
                ...common,
              });
            }

      - name: Post PR gate comment
        # Only runs on pull_request events; skipped on push/workflow_dispatch.
        # Shows the unified gate table when pr-gate-summary.json is available;
        # falls back to PR-risk-only view if the gate step was skipped or failed.
        # Idempotent: updates existing comment via <!-- pr-risk-bot --> marker.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const path = require('path');

            const MARKER       = '<!-- pr-risk-bot -->';
            const STATUS_EMOJI = { PASS: '🟢', WARN: '🟡', BLOCK: '🔴' };
            const REC_DISPLAY  = { PASS: 'PASS (low risk)', WARN: 'WARN', BLOCK: 'BLOCK' };
            const ws           = process.env.GITHUB_WORKSPACE;
            const runUrl       = (process.env.GITHUB_RUN_URL || '').trim();

            // Prefer the unified gate JSON; fall back to PR-risk-only semantic JSON.
            let gateData     = null;
            let semanticData = null;

            try {
              gateData = JSON.parse(fs.readFileSync(path.join(ws, 'artifacts/pr-gate-summary.json'), 'utf8'));
            } catch (e) {
              console.log('Gate summary not available, trying PR risk semantic:', e.message);
            }

            if (!gateData) {
              try {
                semanticData = JSON.parse(fs.readFileSync(path.join(ws, 'artifacts/pr-risk-semantic.json'), 'utf8'));
              } catch (e) {
                console.log('PR risk semantic JSON also unavailable — skipping PR comment:', e.message);
                return;
              }
            }

            let body;

            if (gateData) {
              // ── Unified gate table view ──────────────────────────────────────────
              const gate    = gateData.final_gate        || {};
              const prRisk  = gateData.pr_risk           || {};
              const rr      = gateData.release_readiness || {};

              const gateStatus = (gate.status   || 'UNKNOWN').toUpperCase();
              const riskStatus = (prRisk.status || 'UNKNOWN').toUpperCase();
              const rrStatus   = (rr.status     || 'UNKNOWN').toUpperCase();

              const gateEmoji = STATUS_EMOJI[gateStatus] || '⚪';
              const riskEmoji = STATUS_EMOJI[riskStatus] || '⚪';
              const rrEmoji   = STATUS_EMOJI[rrStatus]   || '⚪';

              const riskLabel = prRisk.label || REC_DISPLAY[riskStatus] || riskStatus;
              const rrLabel   = `${rrStatus} (${rr.score != null ? rr.score : '?'}/100)`;

              const actions = Array.isArray(gateData.required_actions) ? gateData.required_actions : [];
              const factors = Array.isArray(prRisk.top_risk_factors)  ? prRisk.top_risk_factors   : [];

              const lines = [
                MARKER,
                '## 🤖 PR Gate Summary',
                '',
                '| Signal | Result |',
                '|--------|--------|',
                `| PR Risk | ${riskEmoji} ${riskLabel} |`,
                `| Release Readiness | ${rrEmoji} ${rrLabel} |`,
                `| **Final Gate** | **${gateEmoji} ${gateStatus}** |`,
                '',
                '> _This gate is deterministic. PASS does not bypass branch protection or required code review._',
              ];

              if (factors.length > 0) {
                lines.push('', '**Top risk signals:**');
                factors.slice(0, 4).forEach(f => lines.push(`- ${f}`));
              }

              if (actions.length > 0) {
                lines.push('', '**Required before merge:**');
                actions.slice(0, 5).forEach(a => lines.push(`- ${a}`));
              }

              lines.push('');
              lines.push(runUrl
                ? `_Full analysis: [pr-gate-summary.md](${runUrl})_`
                : '_Full analysis in workflow artifacts · `pr-gate-summary.md`_');

              body = lines.join('\n');

            } else {
              // ── Fallback: PR-risk-only view (gate step unavailable) ──────────────
              const rec     = ((semanticData.merge_recommendation || 'UNKNOWN') + '').toUpperCase();
              const display = REC_DISPLAY[rec] || rec;
              const emoji   = STATUS_EMOJI[rec] || '⚪';
              const score   = semanticData.score != null ? semanticData.score : '?';
              const band    = semanticData.band  || 'unknown';
              const factors = Array.isArray(semanticData.top_risk_factors) ? semanticData.top_risk_factors : [];

              const lines = [
                MARKER,
                '## 🤖 PR Risk Assessment',
                '',
                `**Result:** ${emoji} **${display}** &nbsp;·&nbsp; **Score:** ${score} / 100 (${band})`,
                '',
                '> _PR-risk signal only — CI, code review, and required testing still apply._',
              ];

              if (factors.length > 0) {
                lines.push('', '**Top risk signals:**');
                factors.slice(0, 5).forEach(f => lines.push(`- ${f}`));
              } else {
                lines.push('', '_No significant risk signals detected._');
              }

              lines.push('');
              lines.push(runUrl
                ? `_Full analysis in [workflow artifacts](${runUrl}) · \`pr_risk.md\`_`
                : '_Full analysis in workflow artifacts · `pr_risk.md`_');

              body = lines.join('\n');
            }

            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // Paginate through existing comments to find the bot comment (idempotent).
            let existing = null;
            for (let page = 1; !existing; page++) {
              const { data: batch } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 100, page,
              });
              existing = batch.find(c => c.body && c.body.includes(MARKER)) || null;
              if (batch.length < 100) break;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              console.log(`Updated PR gate comment #${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
              console.log(`Created PR gate comment #${created.id}`);
            }

      - name: Add PR Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release Readiness"
            echo ""
            if [[ ! -f artifacts/release-readiness.json ]]; then
              echo "_Machine summary missing (artifacts/release-readiness.json)._"
              exit 0
            fi
            OUTCOME=$(jq -r '.outcome // "unknown"' artifacts/release-readiness.json)
            SCORE=$(jq -r '.score // 0' artifacts/release-readiness.json)
            WARNINGS=$(jq -r '.warnings // 0' artifacts/release-readiness.json)
            BLOCKERS=$(jq -r '.blockers // 0' artifacts/release-readiness.json)
            echo "**Score:** ${SCORE} · Warnings: ${WARNINGS} · Blockers: ${BLOCKERS}"
            echo ""
            case "$OUTCOME" in
              PASS)
                echo "🟢 **PASS** — Ready to merge"
                ;;
              WARN)
                echo "🟡 **WARN** — Review warnings before merging"
                ;;
              BLOCK)
                echo "🔴 **BLOCK** — Do not merge; resolve blockers first"
                ;;
              *)
                echo "⚪ **${OUTCOME}**"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # After artifacts upload and GitHub Check publication — fail only on unified gate BLOCK or payload error.
      - name: Enforce TalkBack PR gate outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f artifacts/pr-gate-check.json ]]; then
            echo "::error::TalkBack PR Gate: artifacts/pr-gate-check.json missing"
            exit 1
          fi
          if jq -e '.workflow_should_fail == true' artifacts/pr-gate-check.json >/dev/null 2>&1; then
            echo "::error::TalkBack PR Gate: final status is BLOCK or gate could not be computed. Do not merge until resolved."
            exit 1
          fi
          echo "TalkBack PR Gate: ok (PASS or WARN)"