name: Release Readiness

on:
  pull_request:
    branches: [main, master]
    # SCRUM-348: skip the gate when the diff only touches docs/agent state
    # (no executable behavior changes). A single non-ignored path in the same
    # PR re-arms the workflow.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.cursor/**'
      - '.epic-run/**'
      - '.claude/**'
  # SCRUM-368: post-merge push to main re-runs the same suite that already
  # passed on the PR. Removed to eliminate duplicate cost; re-arm via
  # workflow_dispatch if a manual full-coverage main-branch run is needed.
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Optional git base ref for manual diff comparison"
        required: false
        default: ""

# SCRUM-348: cancel any in-progress run on the same ref when a new commit
# lands, so PR rebases / amend pushes do not stack full ~5-min pipelines.
concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

# checks: write — publish "TalkBack PR Gate" (and any other Checks API steps) with success/neutral/failure.
# Branch protection: to gate on PASS vs WARN vs BLOCK semantics, require the check named **TalkBack PR Gate**
# (WARN = neutral). You may still require separate workflow/CI checks for tests and builds.
permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Enforcement policy: block_only (default) or warn_and_block (stricter).
  # Change to warn_and_block to block merges on WARN outcomes as well.
  READINESS_ENFORCEMENT_MODE: block_only

jobs:
  release-readiness:
    # SCRUM-348: skip draft PRs so iterative WIP commits do not burn minutes
    # before the author marks the PR ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    services:
      postgres:
        image: postgres:16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: talkback
          POSTGRES_PASSWORD: talkback
          POSTGRES_DB: talkback
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # SCRUM-368: shallow clone; the "Fetch refs for git diff" step below
      # pulls only the base ref (depth 50) needed by PR-risk + path detection.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # SCRUM-368: cache pip-installed readiness deps + pinned
      # release-readiness-core. Key on the requirements file and the
      # core-pin script (any change to either invalidates the cache).
      - name: Cache release-readiness Python deps
        id: rr-pip-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: rr-pip-${{ runner.os }}-py3.12-${{ hashFiles('ops/release-readiness/requirements.txt', 'scripts/release_readiness_core_pin.sh') }}
          restore-keys: |
            rr-pip-${{ runner.os }}-py3.12-

      - name: Install readiness dependencies
        run: pip install -r ops/release-readiness/requirements.txt

      - name: Install release-readiness-core (pinned)
        run: pip install "$(scripts/release_readiness_core_pin.sh spec)"

      - name: Pre-flight - validate release-readiness configs
        run: |
          release-readiness-doctor \
            --config ops/release-readiness/config.yaml \
            --pr-risk-config ops/release-readiness/pr-risk-config.yaml \
            --ci

      - name: Validate Q&A eval datasets
        run: |
          python3 scripts/qa_eval_datasets.py
          python3 scripts/test_qa_eval_datasets.py
          python3 scripts/test_qa_eval_harness_smoke.py

      - name: Test PR risk runner (SCRUM-336)
        run: |
          python3 scripts/test_pr_risk_run.py

      # SCRUM-368: replaced `git fetch --all --tags --prune` (which pulled
      # every remote ref + tag for a shallow-friendly diff base) with a
      # targeted depth-50 fetch of the base ref only. Covers any reasonable
      # PR base distance without paying for the full ref/tag set.
      - name: Fetch base ref for git diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.ref }}"
            git fetch --depth=50 origin "$BASE" || true
          elif [ -n "${{ github.event.inputs.base_ref }}" ]; then
            BASE="${{ github.event.inputs.base_ref }}"
            git fetch --depth=50 origin "$BASE" || true
          fi

      - name: Determine base ref
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              echo "base_ref=$BEFORE" >> "$GITHUB_OUTPUT"
            else
              echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "${{ github.event.inputs.base_ref }}" ]; then
            echo "base_ref=${{ github.event.inputs.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect PPTX/conversion-related changes
        id: changed
        shell: bash
        run: |
          # Non-PR events (push, workflow_dispatch) always install LibreOffice for full release coverage.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "pptx=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On PRs: scan changed files for conversion-relevant paths.
          BASE="${{ steps.base.outputs.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)
          if echo "$CHANGED" | grep -qE \
            '(internal/processing/|internal/transcript/|web/tests/.*[Mm]aterial|web/tests/.*[Pp]ptx|web/e2e/.*[Mm]aterial|web/e2e/.*[Pp]ptx|\.pptx$|libreoffice|poppler)'; then
            echo "pptx=true" >> "$GITHUB_OUTPUT"
          else
            echo "pptx=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR risk scoring (release-readiness-core, SCRUM-336 wrapper)
        id: prrisk
        continue-on-error: true
        run: |
          mkdir -p artifacts/release-readiness
          # SCRUM-336: wraps release-readiness-pr-risk to reclassify pure-UI
          # CreatorMode.jsx edits out of the orchestration domain. Same CLI
          # surface; same artifact paths.
          python3 scripts/pr_risk_run.py \
            --repo-root . \
            --base-ref "${{ steps.base.outputs.base_ref }}" \
            --output-dir artifacts/release-readiness \
            --config ops/release-readiness/pr-risk-config.yaml

      - name: Run Go tests (smoke signal + coverage)
        id: gotest
        continue-on-error: true
        env:
          DATABASE_URL: postgres://talkback:talkback@localhost:5432/talkback?sslmode=disable
          TALKBACK_RUN_LOOM_LIVE_TEST: "1"
        # SCRUM-368: -count=1 removed to allow Go test cache reuse on PR
        # rebases / amend pushes. Coverage still captured via -coverprofile.
        run: go test ./... -coverprofile=coverage.out

      # Go tests use a migrated DB (see internal/database/db_test.go). When tests pass, migrations are validated.
      # Release readiness requires explicit migrations_validated for internal/migrations/** (see ops/release-readiness/README.md).
      - name: Write smoke_results.json
        run: |
          if [ "${{ steps.gotest.outcome }}" = "success" ]; then
            echo '{"status":"passed","failed_count":0,"total_count":1,"validations":{"migrations_validated":true}}' > smoke_results.json
          else
            echo '{"status":"failed","failed_count":1,"total_count":1}' > smoke_results.json
          fi

      - name: Write coverage.json
        run: |
          if [ -f coverage.out ]; then
            TOTAL=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $NF}' | tr -d '%')
            BASELINE=$(python3 -c "import json; print(json.load(open('ops/release-readiness/coverage_baseline.json')).get('baseline_percent', 0))" 2>/dev/null || echo "0")
            echo "{\"line_percent\": $TOTAL, \"baseline_percent\": $BASELINE}" > coverage.json
          else
            echo '{"line_percent": 0, "baseline_percent": 0}' > coverage.json
          fi

      # ── E2E: Node + Playwright ──────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # SCRUM-348: cache the ~150 MB Chromium browser download keyed on
      # web/package-lock.json so a Playwright version bump invalidates the
      # cache automatically. Saves 30–60s per run on cache hits.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (chromium)
        working-directory: web
        # `playwright install` is a no-op when the browser binary is already
        # cached, so it is safe to run unconditionally even on cache-hit.
        run: npx playwright install chromium

      # Validation: E2E uses preview :3000 + API :8081; VITE_API_BASE_URL + global-setup localStorage
      # (talkback.apiBaseUrl) must match TALKBACK_API_BASE on the Playwright step.
      - name: Build frontend
        working-directory: web
        env:
          VITE_API_BASE_URL: http://localhost:8081
        run: npm run build

      - name: Serve frontend (background)
        working-directory: web
        run: |
          # nohup: keep preview alive after this step (next steps hit :3000; see actions/runner background-job notes).
          nohup npm run preview -- --port 3000 > preview.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Frontend did not start within 15s" >&2
          exit 1

      - name: Install LibreOffice, unoconv, and poppler-utils (for PPTX conversion)
        if: steps.changed.outputs.pptx == 'true'
        run: sudo apt-get install -y --no-install-recommends libreoffice unoconv poppler-utils

      - name: Start unoconv listener (persistent LibreOffice for fast PPTX conversion)
        # SCRUM-219: starting `unoconv --listener` once at the top of the job lets
        # subsequent `unoconv -f pdf <file>` calls reuse a long-lived LibreOffice
        # process, dropping per-call cost from ~8-10s (fresh soffice) to ~0.5-1s.
        # The Go server's slides_converter.go picks up `unoconv` automatically via
        # PATH (useUnoconv() / unoconvCmd()), so no env vars need to be set here.
        # If the listener fails to start, this step does NOT fail the job — the
        # Go path falls back to direct soffice --headless and tests still pass,
        # just at the slower per-call cost.
        if: steps.changed.outputs.pptx == 'true'
        continue-on-error: true
        run: |
          nohup unoconv --listener > unoconv-listener.log 2>&1 &
          LPID=$!
          echo $LPID > unoconv-listener.pid
          echo "unoconv listener launched (pid=$LPID)"
          # Wait for the underlying soffice --accept socket to bind. Up to 20s
          # covers cold-start on a fresh runner; if it doesn't come up the Go
          # fallback handles conversions.
          for i in $(seq 1 20); do
            if pgrep -f "soffice.*--accept" > /dev/null 2>&1; then
              echo "unoconv listener ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "unoconv listener did not bind UNO socket within 20s; Go server will fall back to direct soffice." >&2

      - name: Start API server (background)
        env:
          DATABASE_URL: postgres://talkback:talkback@localhost:5432/talkback?sslmode=disable
          PORT: "8081"
          RUN_MIGRATIONS: "true"
          STORAGE_DRIVER: local
          ENCRYPTION_KEY: ci-e2e-test-key-not-for-production
          ALLOW_DEV_RESET: "false"
          TALKBACK_BOOTSTRAP_ADMIN_EMAIL: "ci-admin@smoke.test"
          TALKBACK_BOOTSTRAP_ADMIN_PASSWORD: "SmokePass123!"
          TALKBACK_BOOTSTRAP_ADMIN_DISPLAY_NAME: "CI Admin"
        run: |
          go build -o api-ci ./cmd/api
          ./api-ci > api.log 2>&1 &
          echo $! > api-ci.pid

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
              echo "API is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy within 30s" >&2
          exit 1

      - name: Write prod_health.json
        run: |
          mkdir -p artifacts/release-readiness
          python - <<'PY'
          import json, urllib.request

          def get_json(url: str):
              with urllib.request.urlopen(url, timeout=10) as r:
                  return json.loads(r.read().decode("utf-8"))

          try:
              health = get_json("http://localhost:8081/health")
          except Exception as e:
              health = {"status": "error", "message": str(e)}

          try:
              db_ping = get_json("http://localhost:8081/db/ping")
          except Exception as e:
              db_ping = {"status": "error", "message": str(e)}

          payload = {
              "ok": True,  # Presence-only evidence for readiness scoring.
              "health": health,
              "db_ping": db_ping,
          }
          with open("artifacts/release-readiness/prod_health.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          print("Wrote artifacts/release-readiness/prod_health.json")
          PY

      - name: Sanity check frontend
        run: |
          # Use localhost (same as wait loop). curl http://127.0.0.1 can fail when preview listens on ::1 only.
          curl -I --fail http://localhost:3000

      - name: Run Playwright E2E tests
        id: playwright
        # SCRUM-368: tightened from 45m → 20m. Real runs finish in ~8–10m;
        # 20m leaves headroom for slow PPTX retries without burning 35m
        # buffer on a hung runner.
        timeout-minutes: 20
        continue-on-error: true
        working-directory: web
        env:
          CI: "true"
          TALKBACK_API_BASE: "http://localhost:8081"
          TALKBACK_ADMIN_EMAIL: "ci-admin@smoke.test"
          TALKBACK_ADMIN_PASSWORD: "SmokePass123!"
        run: |
          set -o pipefail
          GREP_ARGS=""
          if [ "${{ steps.changed.outputs.pptx }}" != "true" ]; then
            GREP_ARGS="--grep-invert @pptx"
          fi
          npx playwright test $GREP_ARGS 2>&1 | tee playwright-live.log

      - name: Convert Playwright results to readiness schema (playwright-to-readiness)
        continue-on-error: true
        run: |
          test -f playwright-results.json
          playwright-to-readiness \
            --input playwright-results.json \
            --output e2e_results.json \
            --validation-map ops/release-readiness/e2e-validation-map.yaml

      - name: Stage E2E artifacts (JSON, HTML report, traces/screenshots)
        if: always()
        run: |
          mkdir -p artifacts/e2e-playwright
          for f in playwright-results.json e2e_results.json; do
            if [ -f "$f" ]; then cp -f "$f" artifacts/e2e-playwright/; fi
          done
          if [ -d web/playwright-report ]; then cp -R web/playwright-report artifacts/e2e-playwright/; fi
          if [ -d web/test-results ]; then cp -R web/test-results artifacts/e2e-playwright/; fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          def walk_failed_specs(node, file_hint=""):
              rows = []
              f = node.get("file") or file_hint
              for spec in node.get("specs", []):
                  sf = spec.get("file") or f
                  if spec.get("ok") is False:
                      rows.append((sf, spec.get("title", "")))
              for child in node.get("suites", []):
                  rows.extend(walk_failed_specs(child, f))
              return rows

          out = Path("artifacts/e2e-playwright/README.txt")
          lines = [
              "E2E artifact bundle (uploaded on every run; see release-readiness artifact).",
              "",
              "Files:",
              "  playwright-results.json — raw Playwright --reporter=json",
              "  e2e_results.json — readiness schema (release-readiness-core's playwright-to-readiness)",
              "  playwright-report/index.html — open locally after download",
              "  test-results/ — traces, screenshots (when failures/retries)",
              "",
          ]
          pr = Path("playwright-results.json")
          if pr.exists():
              try:
                  pw = json.loads(pr.read_text(encoding="utf-8"))
                  failed_specs = []
                  for root in pw.get("suites", []):
                      failed_specs.extend(walk_failed_specs(root))
                  if failed_specs:
                      lines.append("Failed specs (file + title from playwright-results.json):")
                      for fp, title in failed_specs:
                          lines.append(f"  - {fp}")
                          lines.append(f"    {title}")
                  else:
                      lines.append("Failed specs: (none with ok=false in JSON — see stats.unexpected or HTML report)")
              except Exception as e:
                  lines.append(f"(Could not parse playwright-results.json: {e})")
          else:
              lines.append("(playwright-results.json missing)")
          lines.append("")
          p = Path("e2e_results.json")
          if p.exists():
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  lines.append("Summary from e2e_results.json:")
                  lines.append(f"  status={d.get('status')}")
                  lines.append(f"  failed_count={d.get('failed_count')}")
                  lines.append(f"  total_count={d.get('total_count')}")
                  lines.append(f"  retries={d.get('retries')}")
                  fails = d.get("failures") or []
                  if fails:
                      lines.append("  failures[].title:")
                      for item in fails:
                          t = item.get("title") or item.get("name") or "?"
                          lines.append(f"    - {t}")
                  else:
                      lines.append("  failures: (empty)")
              except Exception as e:
                  lines.append(f"(Could not parse e2e_results.json: {e})")
          else:
              lines.append("(e2e_results.json missing — convert step may have failed.)")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload Playwright logs and artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-logs
          path: |
            playwright-results.json
            web/playwright-live.log
            web/playwright-report/
            web/test-results/
            api.log
          if-no-files-found: ignore

      - name: Run release-readiness-evaluate
        id: readiness
        continue-on-error: true
        shell: bash
        run: |
          # release-readiness-evaluate exits non-zero on BLOCK; combine still
          # runs to emit a partial gate summary, so the step swallows the exit
          # code. The dedicated "Evaluate Release Readiness Outcome" step
          # below is responsible for failing the job on BLOCK.
          release-readiness-evaluate \
            --repo-root . \
            --config ops/release-readiness/config.yaml \
            --base-ref "${{ steps.base.outputs.base_ref }}" \
            --smoke-results smoke_results.json \
            --e2e-results e2e_results.json \
            --coverage coverage.json \
            --prod-health artifacts/release-readiness/prod_health.json \
            --output-dir artifacts/release-readiness || true

      - name: Evaluate Release Readiness Outcome
        id: evaluate
        if: always()
        shell: bash
        env:
          READINESS_ENFORCEMENT_MODE: ${{ env.READINESS_ENFORCEMENT_MODE }}
        run: |
          set -euo pipefail
          if [[ "${READINESS_FAILED:-}" == "true" ]]; then
            echo "::error::Release readiness execution failed"
            exit 1
          fi
          if [[ ! -f artifacts/release-readiness.json ]]; then
            echo "::error::artifacts/release-readiness.json missing"
            exit 1
          fi
          OUTCOME=$(jq -r '.outcome // empty' artifacts/release-readiness.json)
          echo "Outcome: $OUTCOME"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          MODE="${READINESS_ENFORCEMENT_MODE:-block_only}"
          if [[ "$OUTCOME" == "PASS" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OUTCOME" == "WARN" ]]; then
            echo "::warning::Release Readiness is WARN. Review report artifact."
            echo "status=warn" >> "$GITHUB_OUTPUT"
            if [[ "$MODE" == "warn_and_block" ]]; then
              echo "::error::Release Readiness is WARN and READINESS_ENFORCEMENT_MODE=warn_and_block."
              exit 1
            fi
            exit 0
          fi
          if [[ "$OUTCOME" == "BLOCK" ]]; then
            echo "::error::Release Readiness is BLOCK. Failing check."
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::error::Unknown outcome: $OUTCOME"
          exit 1

      # SCRUM-267: combine PR Risk + Release Readiness into the unified gate
      # via release-readiness-core's CLIs (PR-risk generation lands at
      # artifacts/release-readiness/pr-risk.json; release-readiness-evaluate
      # writes the lean release-readiness.json at <repo-root>/artifacts/ and
      # the full report under artifacts/release-readiness/run/report.json,
      # mirroring the SCRUM-265 shadow paths).
      - name: Run release-readiness-combine
        if: always()
        continue-on-error: true
        run: |
          # release-readiness-pr-risk and release-readiness-evaluate write
          # lean machine summaries at the PARENT of --output-dir
          # (artifacts/pr-risk.json, artifacts/release-readiness.json — the
          # latter is hardcoded to <repo-root>/artifacts/ regardless of
          # --output-dir). The full readiness report lands inside
          # --output-dir at artifacts/release-readiness/report.json. The
          # original SCRUM-265 shadow job buried these one level deeper
          # under release-readiness-shadow/run/ — we don't need that subdir
          # in the consolidated job, but combine has to know where the lean
          # files actually live.
          release-readiness-combine \
            --pr-risk-json artifacts/pr-risk.json \
            --readiness-json artifacts/release-readiness.json \
            --readiness-report-json artifacts/release-readiness/report.json \
            --output-dir artifacts \
            --step-summary

      # Build the GitHub Checks API payload from the unified gate summary.
      # SCRUM-267 phase 2: --warn-conclusion action_required matches the
      # legacy required-check semantics (WARN blocks merge, workflow stays
      # green). Optional phase-3 "failure" toggle is the only further change
      # needed to lock down WARN with red workflow status.
      - name: Build PR gate GitHub Check payload
        if: always()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          release-readiness-check-payload \
            --gate-json artifacts/pr-gate-summary.json \
            --output artifacts/pr-gate-check.json \
            --run-url "$GITHUB_RUN_URL" \
            --check-name "TalkBack PR Gate" \
            --warn-conclusion action_required

      - name: Upload Release Readiness Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-readiness
          path: |
            artifacts/
            smoke_results.json
            e2e_results.json
            coverage.json
          if-no-files-found: warn

      - name: Publish TalkBack PR Gate check
        if: always()
        uses: actions/github-script@v8
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const ws = process.env.GITHUB_WORKSPACE;
            const checkPath = path.join(ws, 'artifacts/pr-gate-check.json');
            let payload;
            try {
              payload = JSON.parse(fs.readFileSync(checkPath, 'utf8'));
            } catch (e) {
              const runUrl = (process.env.GITHUB_RUN_URL || '').trim();
              payload = {
                check_name: 'TalkBack PR Gate',
                check_conclusion: 'failure',
                title: 'TalkBack PR Gate: error',
                summary: 'Could not read artifacts/pr-gate-check.json — ' + String(e),
                text: '### Error\n\n' + String(e) + (runUrl ? '\n\n' + runUrl : ''),
                details_url: runUrl || undefined,
              };
            }
            const headSha = context.payload.pull_request?.head?.sha || context.sha;
            const checkName = payload.check_name || 'TalkBack PR Gate';
            const runUrl = (process.env.GITHUB_RUN_URL || '').trim();
            if (runUrl && payload.summary && !payload.summary.includes(runUrl)) {
              payload.summary = (payload.summary || '') + '\n\n**Workflow run / artifacts:** ' + runUrl;
            }
            const { data: listed } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              check_name: checkName,
            });
            const runs = (listed.check_runs || []).slice().sort((a, b) => b.id - a.id);
            const output = {
              title: payload.title,
              summary: payload.summary || '',
              text: payload.text || '',
            };
            const common = {
              status: 'completed',
              conclusion: payload.check_conclusion,
              output,
            };
            if (payload.details_url) {
              common.details_url = payload.details_url;
            }
            if (runs.length > 0) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: runs[0].id,
                ...common,
              });
            } else {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: checkName,
                head_sha: headSha,
                ...common,
              });
            }

      - name: Post PR gate comment
        # Only runs on pull_request events; skipped on push/workflow_dispatch.
        # Shows the unified gate table when pr-gate-summary.json is available;
        # falls back to PR-risk-only view if the gate step was skipped or failed.
        # Idempotent: updates existing comment via <!-- pr-risk-bot --> marker.
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const path = require('path');

            const MARKER       = '<!-- pr-risk-bot -->';
            const STATUS_EMOJI = { PASS: '🟢', WARN: '🟡', BLOCK: '🔴' };
            const REC_DISPLAY  = { PASS: 'PASS (low risk)', WARN: 'WARN', BLOCK: 'BLOCK' };
            const ws           = process.env.GITHUB_WORKSPACE;
            const runUrl       = (process.env.GITHUB_RUN_URL || '').trim();

            // Prefer the unified gate JSON; fall back to PR-risk-only semantic JSON.
            let gateData     = null;
            let semanticData = null;

            try {
              gateData = JSON.parse(fs.readFileSync(path.join(ws, 'artifacts/pr-gate-summary.json'), 'utf8'));
            } catch (e) {
              console.log('Gate summary not available, trying PR risk semantic:', e.message);
            }

            if (!gateData) {
              try {
                semanticData = JSON.parse(fs.readFileSync(path.join(ws, 'artifacts/pr-risk-semantic.json'), 'utf8'));
              } catch (e) {
                console.log('PR risk semantic JSON also unavailable — skipping PR comment:', e.message);
                return;
              }
            }

            let body;

            if (gateData) {
              // ── Unified gate table view ──────────────────────────────────────────
              const gate    = gateData.final_gate        || {};
              const prRisk  = gateData.pr_risk           || {};
              const rr      = gateData.release_readiness || {};

              const gateStatus = (gate.status   || 'UNKNOWN').toUpperCase();
              const riskStatus = (prRisk.status || 'UNKNOWN').toUpperCase();
              const rrStatus   = (rr.status     || 'UNKNOWN').toUpperCase();

              const gateEmoji = STATUS_EMOJI[gateStatus] || '⚪';
              const riskEmoji = STATUS_EMOJI[riskStatus] || '⚪';
              const rrEmoji   = STATUS_EMOJI[rrStatus]   || '⚪';

              const riskLabel = prRisk.label || REC_DISPLAY[riskStatus] || riskStatus;
              const rrLabel   = `${rrStatus} (${rr.score != null ? rr.score : '?'}/100)`;

              const actions = Array.isArray(gateData.required_actions) ? gateData.required_actions : [];
              const factors = Array.isArray(prRisk.top_risk_factors)  ? prRisk.top_risk_factors   : [];

              const lines = [
                MARKER,
                '## 🤖 PR Gate Summary',
                '',
                '| Signal | Result |',
                '|--------|--------|',
                `| PR Risk | ${riskEmoji} ${riskLabel} |`,
                `| Release Readiness | ${rrEmoji} ${rrLabel} |`,
                `| **Final Gate** | **${gateEmoji} ${gateStatus}** |`,
                '',
                '> _This gate is deterministic. PASS does not bypass branch protection or required code review._',
              ];

              if (factors.length > 0) {
                lines.push('', '**Top risk signals:**');
                factors.slice(0, 4).forEach(f => lines.push(`- ${f}`));
              }

              if (actions.length > 0) {
                lines.push('', '**Required before merge:**');
                actions.slice(0, 5).forEach(a => lines.push(`- ${a}`));
              }

              lines.push('');
              lines.push(runUrl
                ? `_Full analysis: [pr-gate-summary.md](${runUrl})_`
                : '_Full analysis in workflow artifacts · `pr-gate-summary.md`_');

              body = lines.join('\n');

            } else {
              // ── Fallback: PR-risk-only view (gate step unavailable) ──────────────
              const rec     = ((semanticData.merge_recommendation || 'UNKNOWN') + '').toUpperCase();
              const display = REC_DISPLAY[rec] || rec;
              const emoji   = STATUS_EMOJI[rec] || '⚪';
              const score   = semanticData.score != null ? semanticData.score : '?';
              const band    = semanticData.band  || 'unknown';
              const factors = Array.isArray(semanticData.top_risk_factors) ? semanticData.top_risk_factors : [];

              const lines = [
                MARKER,
                '## 🤖 PR Risk Assessment',
                '',
                `**Result:** ${emoji} **${display}** &nbsp;·&nbsp; **Score:** ${score} / 100 (${band})`,
                '',
                '> _PR-risk signal only — CI, code review, and required testing still apply._',
              ];

              if (factors.length > 0) {
                lines.push('', '**Top risk signals:**');
                factors.slice(0, 5).forEach(f => lines.push(`- ${f}`));
              } else {
                lines.push('', '_No significant risk signals detected._');
              }

              lines.push('');
              lines.push(runUrl
                ? `_Full analysis in [workflow artifacts](${runUrl}) · \`pr_risk.md\`_`
                : '_Full analysis in workflow artifacts · `pr_risk.md`_');

              body = lines.join('\n');
            }

            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            // Paginate through existing comments to find the bot comment (idempotent).
            let existing = null;
            for (let page = 1; !existing; page++) {
              const { data: batch } = await github.rest.issues.listComments({
                owner, repo, issue_number: prNumber, per_page: 100, page,
              });
              existing = batch.find(c => c.body && c.body.includes(MARKER)) || null;
              if (batch.length < 100) break;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              console.log(`Updated PR gate comment #${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
              console.log(`Created PR gate comment #${created.id}`);
            }

      - name: Add PR Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release Readiness"
            echo ""
            if [[ ! -f artifacts/release-readiness.json ]]; then
              echo "_Machine summary missing (artifacts/release-readiness.json)._"
              exit 0
            fi
            OUTCOME=$(jq -r '.outcome // "unknown"' artifacts/release-readiness.json)
            SCORE=$(jq -r '.score // 0' artifacts/release-readiness.json)
            WARNINGS=$(jq -r '.warnings // 0' artifacts/release-readiness.json)
            BLOCKERS=$(jq -r '.blockers // 0' artifacts/release-readiness.json)
            echo "**Score:** ${SCORE} · Warnings: ${WARNINGS} · Blockers: ${BLOCKERS}"
            echo ""
            case "$OUTCOME" in
              PASS)
                echo "🟢 **PASS** — Ready to merge"
                ;;
              WARN)
                echo "🟡 **WARN** — Review warnings before merging"
                ;;
              BLOCK)
                echo "🔴 **BLOCK** — Do not merge; resolve blockers first"
                ;;
              *)
                echo "⚪ **${OUTCOME}**"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      # After artifacts upload and GitHub Check publication — fail only on unified gate BLOCK or payload error.
      - name: Enforce TalkBack PR gate outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f artifacts/pr-gate-check.json ]]; then
            echo "::error::TalkBack PR Gate: artifacts/pr-gate-check.json missing"
            exit 1
          fi
          if jq -e '.workflow_should_fail == true' artifacts/pr-gate-check.json >/dev/null 2>&1; then
            echo "::error::TalkBack PR Gate: final status is BLOCK or gate could not be computed. Do not merge until resolved."
            exit 1
          fi
          echo "TalkBack PR Gate: ok (PASS or WARN)"
