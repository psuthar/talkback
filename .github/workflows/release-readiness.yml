name: Release Readiness

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Optional git base ref for manual diff comparison"
        required: false
        default: ""

# checks: write — publish "PR Risk / semantic-result" via Checks API (success / neutral / failure).
# For required-check semantics on PASS vs WARN vs BLOCK, prefer protecting that check name in
# branch rules rather than relying on the overall workflow job alone.
permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Enforcement policy: block_only (default) or warn_and_block (stricter).
  # Change to warn_and_block to block merges on WARN outcomes as well.
  READINESS_ENFORCEMENT_MODE: block_only

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    services:
      postgres:
        image: postgres:16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: talkback
          POSTGRES_PASSWORD: talkback
          POSTGRES_DB: talkback
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install readiness dependencies
        run: pip install -r ops/release-readiness/requirements.txt

      - name: Fetch refs for git diff
        run: git fetch --all --tags --prune || true

      - name: Determine base ref
        id: base
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              echo "base_ref=$BEFORE" >> "$GITHUB_OUTPUT"
            else
              echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
            fi
          elif [ -n "${{ github.event.inputs.base_ref }}" ]; then
            echo "base_ref=${{ github.event.inputs.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: PR risk scoring (v2.6)
        id: prrisk
        continue-on-error: true
        run: |
          mkdir -p artifacts/release-readiness
          go run ./cmd/prrisk \
            --repo-root . \
            --base-ref "${{ steps.base.outputs.base_ref }}" \
            --output-dir artifacts/release-readiness

      # Ensures PR Risk outputs exist in Actions artifacts even if a later step fails before the bundle upload.
      - name: Upload PR Risk artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr-risk
          path: |
            artifacts/pr-risk.json
            artifacts/release-readiness/pr_risk.json
            artifacts/release-readiness/pr_risk.md
          if-no-files-found: warn

      - name: Run Go tests (smoke signal + coverage)
        id: gotest
        continue-on-error: true
        env:
          DATABASE_URL: postgres://talkback:talkback@localhost:5432/talkback?sslmode=disable
        run: go test ./... -count=1 -coverprofile=coverage.out

      - name: Write smoke_results.json
        run: |
          if [ "${{ steps.gotest.outcome }}" = "success" ]; then
            echo '{"status":"passed","failed_count":0,"total_count":1}' > smoke_results.json
          else
            echo '{"status":"failed","failed_count":1,"total_count":1}' > smoke_results.json
          fi

      - name: Write coverage.json
        run: |
          if [ -f coverage.out ]; then
            TOTAL=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $NF}' | tr -d '%')
            BASELINE=$(python3 -c "import json; print(json.load(open('ops/release-readiness/coverage_baseline.json')).get('baseline_percent', 0))" 2>/dev/null || echo "0")
            echo "{\"line_percent\": $TOTAL, \"baseline_percent\": $BASELINE}" > coverage.json
          else
            echo '{"line_percent": 0, "baseline_percent": 0}' > coverage.json
          fi

      # ── E2E: Node + Playwright ──────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Install Playwright browsers (chromium only)
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Serve frontend (background)
        working-directory: web
        run: |
          npm run preview -- --port 3000 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Frontend did not start within 15s" >&2
          exit 1

      - name: Install LibreOffice and poppler-utils (for PPTX conversion)
        run: sudo apt-get install -y --no-install-recommends libreoffice poppler-utils

      - name: Start API server (background)
        env:
          DATABASE_URL: postgres://talkback:talkback@localhost:5432/talkback?sslmode=disable
          PORT: "8081"
          RUN_MIGRATIONS: "true"
          STORAGE_DRIVER: local
          ENCRYPTION_KEY: ci-e2e-test-key-not-for-production
          ALLOW_DEV_RESET: "false"
        run: |
          go build -o api-ci ./cmd/api
          ./api-ci &
          echo $! > api-ci.pid

      - name: Wait for API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
              echo "API is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy within 30s" >&2
          exit 1

      - name: Write prod_health.json
        run: |
          mkdir -p artifacts/release-readiness
          python - <<'PY'
          import json, urllib.request

          def get_json(url: str):
              with urllib.request.urlopen(url, timeout=10) as r:
                  return json.loads(r.read().decode("utf-8"))

          try:
              health = get_json("http://localhost:8081/health")
          except Exception as e:
              health = {"status": "error", "message": str(e)}

          try:
              db_ping = get_json("http://localhost:8081/db/ping")
          except Exception as e:
              db_ping = {"status": "error", "message": str(e)}

          payload = {
              "ok": True,  # Presence-only evidence for readiness scoring.
              "health": health,
              "db_ping": db_ping,
          }
          with open("artifacts/release-readiness/prod_health.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          print("Wrote artifacts/release-readiness/prod_health.json")
          PY

      - name: Run Playwright E2E tests
        id: playwright
        continue-on-error: true
        working-directory: web
        env:
          CI: "true"
          TALKBACK_API_BASE: "http://localhost:8081"
          TALKBACK_ADMIN_EMAIL: "ci-admin@smoke.test"
          TALKBACK_ADMIN_PASSWORD: "SmokePass123!"
        run: |
          npx playwright test --reporter=json 2>/dev/null > ../playwright-results.json || true

      - name: Convert Playwright results to readiness schema
        run: |
          python scripts/e2e_to_readiness.py \
            --input playwright-results.json \
            --output e2e_results.json

      - name: Run release readiness
        id: readiness
        continue-on-error: true
        shell: bash
        env:
          READINESS_ENFORCEMENT_MODE: ${{ env.READINESS_ENFORCEMENT_MODE }}
        run: |
          bash scripts/release-readiness.sh \
            --repo-root . \
            --config ops/release-readiness/config.yaml \
            --base-ref "${{ steps.base.outputs.base_ref }}" \
            --smoke-results smoke_results.json \
            --e2e-results e2e_results.json \
            --coverage coverage.json \
            --prod-health artifacts/release-readiness/prod_health.json \
            --output-dir artifacts/release-readiness \
            --enforcement-mode "${READINESS_ENFORCEMENT_MODE:-block_only}"

      - name: Evaluate Release Readiness Outcome
        id: evaluate
        if: always()
        shell: bash
        env:
          READINESS_ENFORCEMENT_MODE: ${{ env.READINESS_ENFORCEMENT_MODE }}
        run: |
          set -euo pipefail
          if [[ "${READINESS_FAILED:-}" == "true" ]]; then
            echo "::error::Release readiness execution failed"
            exit 1
          fi
          if [[ ! -f artifacts/release-readiness.json ]]; then
            echo "::error::artifacts/release-readiness.json missing"
            exit 1
          fi
          OUTCOME=$(jq -r '.outcome // empty' artifacts/release-readiness.json)
          echo "Outcome: $OUTCOME"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          MODE="${READINESS_ENFORCEMENT_MODE:-block_only}"
          if [[ "$OUTCOME" == "PASS" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OUTCOME" == "WARN" ]]; then
            echo "::warning::Release Readiness is WARN. Review report artifact."
            echo "status=warn" >> "$GITHUB_OUTPUT"
            if [[ "$MODE" == "warn_and_block" ]]; then
              echo "::error::Release Readiness is WARN and READINESS_ENFORCEMENT_MODE=warn_and_block."
              exit 1
            fi
            exit 0
          fi
          if [[ "$OUTCOME" == "BLOCK" ]]; then
            echo "::error::Release Readiness is BLOCK. Failing check."
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "::error::Unknown outcome: $OUTCOME"
          exit 1

      # Maps merge_recommendation to Checks API conclusions (PASS→success, WARN→neutral, BLOCK→failure).
      # Does not use continue-on-error: the job must fail on BLOCK or generator/parsing errors.
      - name: Evaluate PR risk semantic result
        id: prrisk_semantic
        if: always()
        env:
          PRRISK_GEN_OUTCOME: ${{ steps.prrisk.outcome }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/evaluate_pr_risk_semantic.py \
            --pr-risk-json artifacts/pr-risk.json \
            --generator-outcome "$PRRISK_GEN_OUTCOME" \
            --semantic-json-out artifacts/pr-risk-semantic.json

      - name: Publish PR Risk semantic check
        if: always()
        uses: actions/github-script@v7
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const headSha = context.payload.pull_request?.head?.sha || context.sha;
            const semanticPath = path.join(process.env.GITHUB_WORKSPACE, 'artifacts/pr-risk-semantic.json');
            let payload;
            try {
              payload = JSON.parse(fs.readFileSync(semanticPath, 'utf8'));
            } catch (e) {
              payload = {
                check_conclusion: 'failure',
                title: 'PR Risk: error',
                summary: 'Could not read artifacts/pr-risk-semantic.json — ' + String(e),
                text: String(e),
              };
            }
            const runUrl = process.env.GITHUB_RUN_URL || '';
            if (runUrl) {
              payload.summary = (payload.summary || '') + '\n\n**Workflow run / artifacts:** ' + runUrl;
            }
            const checkName = 'PR Risk / semantic-result';
            const { data: listed } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              check_name: checkName,
            });
            const runs = (listed.check_runs || []).slice().sort((a, b) => b.id - a.id);
            const output = {
              title: payload.title,
              summary: payload.summary || '',
              text: payload.text || '',
            };
            const common = {
              status: 'completed',
              conclusion: payload.check_conclusion,
              output,
            };
            if (runs.length > 0) {
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: runs[0].id,
                ...common,
              });
            } else {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: checkName,
                head_sha: headSha,
                ...common,
              });
            }

      - name: Upload Release Readiness Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-readiness
          path: artifacts/
          if-no-files-found: warn

      - name: Add PR Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release Readiness"
            echo ""
            if [[ ! -f artifacts/release-readiness.json ]]; then
              echo "_Machine summary missing (artifacts/release-readiness.json)._"
              exit 0
            fi
            OUTCOME=$(jq -r '.outcome // "unknown"' artifacts/release-readiness.json)
            SCORE=$(jq -r '.score // 0' artifacts/release-readiness.json)
            WARNINGS=$(jq -r '.warnings // 0' artifacts/release-readiness.json)
            BLOCKERS=$(jq -r '.blockers // 0' artifacts/release-readiness.json)
            echo "**Score:** ${SCORE} · Warnings: ${WARNINGS} · Blockers: ${BLOCKERS}"
            echo ""
            case "$OUTCOME" in
              PASS)
                echo "🟢 **PASS** — Ready to merge"
                ;;
              WARN)
                echo "🟡 **WARN** — Review warnings before merging"
                ;;
              BLOCK)
                echo "🔴 **BLOCK** — Do not merge; resolve blockers first"
                ;;
              *)
                echo "⚪ **${OUTCOME}**"
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"