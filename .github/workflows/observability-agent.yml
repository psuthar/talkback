# Observability agent loop: run tests, obsworker, upload bundles, post to daily GitHub Issue.
# Requires: NEW_RELIC_API_KEY, NEW_RELIC_ACCOUNT_ID (repo secrets).
# Optional: OBS_WINDOW_MINUTES (default 30), NEW_RELIC_REGION (US), OBS_APP_NAME.

name: Observability Agent

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # every 60 minutes

jobs:
  observability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check for New Relic secrets
        id: check-secrets
        env:
          KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          AID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
        run: |
          if [ -n "$KEY" ] && [ -n "$AID" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "Observability will run (secrets present)."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::notice::NEW_RELIC_API_KEY or NEW_RELIC_ACCOUNT_ID not set. Skipping obsworker and issue steps. Add repo secrets to enable."
          fi

      - name: Run tests
        run: go test ./...

      - name: Run obsworker
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          OBS_WINDOW_MINUTES: ${{ vars.OBS_WINDOW_MINUTES || '30' }}
          OBS_APP_NAME: ${{ vars.OBS_APP_NAME || '' }}
        run: go run ./cmd/obsworker

      - name: Upload bundle artifacts
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: talkback-observability-bundle-${{ github.run_id }}
          path: |
            ops/bundles/*-bundle.md
            ops/bundles/*-bundle.json
          if-no-files-found: error

      - name: Post bundle to daily Issue (create or comment)
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const workspace = process.env.GITHUB_WORKSPACE;
            const bundlesDir = path.join(workspace, 'ops/bundles');
            const promptPath = path.join(workspace, 'ops/observability/COENGINEER_PROMPT.md');

            const mdFiles = fs.readdirSync(bundlesDir)
              .filter(f => f.endsWith('-bundle.md'))
              .sort()
              .reverse();
            if (mdFiles.length === 0) {
              core.setFailed('No *-bundle.md file found in ops/bundles');
              return;
            }
            const latestMd = mdFiles[0];
            let bundleMd = fs.readFileSync(path.join(bundlesDir, latestMd), 'utf8');
            const maxCommentLen = 55000;
            if (bundleMd.length > maxCommentLen) {
              bundleMd = bundleMd.slice(0, maxCommentLen) + '\n\n---\n*(Bundle truncated; download the workflow artifact for the full file.)*';
            }

            const today = new Date().toISOString().slice(0, 10);
            const issueTitle = `TalkBack Observability Bundle - ${today}`;

            let promptBody = '';
            try {
              promptBody = fs.readFileSync(promptPath, 'utf8');
            } catch (e) {
              promptBody = '*(COENGINEER_PROMPT.md not found)*';
            }

            const intro = `## How to use this\n\nPaste the **latest comment** (bundle) + the co-engineer prompt below into Cursor or ChatGPT for analysis.\n\n**Loop:** Run → Bundle → Inbox → AI analysis → Fix → Next run verifies.\n\n---\n\n`;
            const bundleSection = '\n\n---\n\n### Latest bundle (markdown)\n\n```\n' + bundleMd + '\n```';
            const maxBodyLen = 62000;
            let fullBody = intro + '### Co-engineer prompt template\n\n' + promptBody + bundleSection;
            if (fullBody.length > maxBodyLen) {
              fullBody = fullBody.slice(0, maxBodyLen) + '\n\n*(Body truncated; see workflow artifacts for full bundle.)*';
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === issueTitle);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Bundle \`${latestMd}\` (run ${context.runId})\n\n<details>\n<summary>Markdown bundle</summary>\n\n\`\`\`md\n${bundleMd}\n\`\`\`\n\n</details>\n\n*Artifact: \`talkback-observability-bundle-${context.runId}\`*`
              });
              core.notice(`Updated issue #${existing.number} with new bundle comment`);
            } else {
              const labels = ['observability', 'agent'];
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body: fullBody,
                  labels
                });
              } catch (e) {
                if (e.message && e.message.includes('Validation Failed') && e.message.includes('label')) {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: issueTitle,
                    body: fullBody
                  });
                } else {
                  throw e;
                }
              }
              core.notice(`Created new issue: ${issueTitle}`);
            }
