# Observability agent loop: run tests, obsworker, upload bundles, post to daily GitHub Issue.
# Requires: NEW_RELIC_API_KEY, NEW_RELIC_ACCOUNT_ID (repo secrets).
# Optional: OBS_WINDOW_MINUTES (default 30), NEW_RELIC_REGION (US), OBS_APP_NAME.
# Simulation (repo variables): set OBS_FORCE_STATUS=RED|YELLOW|GREEN to override status and run deep-dive; OBS_FORCE_REASON (optional); OBS_FORCE_DEEP_DIVE=true to force deep-dive when GREEN. Leave unset for normal runs.
# For "Key Deltas" (not "First run (no baseline)"): add R2_* repo secrets so baseline persists in R2. Observability uses a dedicated path (observability/baselines/) so it does not mix with application data (sessions/).

name: Observability Agent

on:
  workflow_dispatch:
  schedule:
    # SCRUM-348: dropped from hourly to every 6 hours to keep within the
    # 3,000-min/month included GitHub Actions budget. Cron + push to main
    # used to double-fire; the push trigger is removed because release-readiness
    # already runs on every merge to main and provides the same regression signal
    # for application-layer changes. workflow_dispatch remains for manual runs.
    - cron: '0 */6 * * *'   # every 6 hours

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  observability:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: read   # checkout repo
      issues: write   # create/update daily issue and add comments
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talkback
          POSTGRES_PASSWORD: talkback
          POSTGRES_DB: talkback
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Debug — workflow context
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }} run_id=${{ github.run_id }}"
          echo "actor=${{ github.actor }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check for New Relic secrets
        id: check-secrets
        env:
          KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          AID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
        run: |
          if [ -n "$KEY" ] && [ -n "$AID" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "Observability will run (secrets present)."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::notice::NEW_RELIC_API_KEY or NEW_RELIC_ACCOUNT_ID not set. Skipping obsworker and issue steps. Add repo secrets to enable."
          fi

      - name: Debug — secrets and next steps
        run: |
          echo "has_secrets=${{ steps.check-secrets.outputs.has_secrets }}"
          [ "${{ steps.check-secrets.outputs.has_secrets }}" = "true" ] && echo "Next: run tests → obsworker → upload → issue" || echo "Next: run tests only (obsworker/upload/issue skipped)"

      - name: Run tests
        env:
          DATABASE_URL: postgres://talkback:talkback@localhost:5432/talkback?sslmode=disable
        run: go test ./...

      - name: Generate smoke traffic (optional)
        if: steps.check-secrets.outputs.has_secrets == 'true' && vars.RUN_OBS_SMOKE == 'true'
        env:
          TALKBACK_BASE_URL: ${{ vars.TALKBACK_BASE_URL }}
        run: go run ./cmd/obssmoke

      - name: Run obsworker
        if: steps.check-secrets.outputs.has_secrets == 'true'
        env:
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
          NEW_RELIC_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION || 'US' }}
          OBS_WINDOW_MINUTES: ${{ vars.OBS_WINDOW_MINUTES || '30' }}
          OBS_APP_NAME: ${{ vars.OBS_APP_NAME || '' }}
          OBS_REQUIRE_APPNAME_FILTER: ${{ vars.OBS_REQUIRE_APPNAME_FILTER || 'false' }}
          OBS_AUTH_USER_THRESHOLD: ${{ vars.OBS_AUTH_USER_THRESHOLD || '5' }}
          OBS_AUTH_WINDOW_MINUTES: ${{ vars.OBS_AUTH_WINDOW_MINUTES || '' }}
          OBS_AUTH_ERROR_MESSAGE: ${{ vars.OBS_AUTH_ERROR_MESSAGE || 'Unauthorized' }}
          OBS_AUTH_ERROR_CLASS: ${{ vars.OBS_AUTH_ERROR_CLASS || '401' }}
          # Simulation: use Variables or Secrets (leave unset for normal runs)
          OBS_FORCE_STATUS: ${{ vars.OBS_FORCE_STATUS || secrets.OBS_FORCE_STATUS || '' }}
          OBS_FORCE_REASON: ${{ vars.OBS_FORCE_REASON || secrets.OBS_FORCE_REASON || '' }}
          OBS_FORCE_DEEP_DIVE: ${{ vars.OBS_FORCE_DEEP_DIVE || secrets.OBS_FORCE_DEEP_DIVE || 'false' }}
          # AI analysis (YELLOW/RED only, one call per run). Optional: set OBS_ENABLE_AI_ANALYSIS=true and OBS_AI_API_KEY (and optionally OBS_AI_PROVIDER, OBS_AI_MODEL).
          OBS_ENABLE_AI_ANALYSIS: ${{ vars.OBS_ENABLE_AI_ANALYSIS || secrets.OBS_ENABLE_AI_ANALYSIS || 'false' }}
          OBS_AI_API_KEY: ${{ secrets.OBS_AI_API_KEY }}
          OBS_AI_PROVIDER: ${{ vars.OBS_AI_PROVIDER || secrets.OBS_AI_PROVIDER || 'openai' }}
          OBS_AI_MODEL: ${{ vars.OBS_AI_MODEL || secrets.OBS_AI_MODEL || '' }}
          # Persist baseline in R2 so next run shows Key Deltas (not "First run (no baseline)"). Optional: add repo secrets to enable.
          OBS_BASELINE_R2: '1'
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
          R2_REGION: auto
        run: go run ./cmd/obsworker

      - name: Upload bundle artifacts
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: talkback-observability-bundle-${{ github.run_id }}
          path: |
            ops/bundles/*-bundle.md
            ops/bundles/*-bundle.json
          if-no-files-found: error

      - name: Get bundle status (JSON)
        id: bundle
        if: steps.check-secrets.outputs.has_secrets == 'true'
        run: |
          JSON=$(ls ops/bundles/*-bundle.json 2>/dev/null | sort -r | head -1)
          if [ -z "$JSON" ]; then
            echo "status=GREEN" >> $GITHUB_OUTPUT
            echo "simulation_enabled=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          STATUS=$(jq -r '.summary.status // .delta.status // "GREEN"' "$JSON")
          SIM=$(jq -r '.simulation.enabled // false' "$JSON")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "simulation_enabled=$SIM" >> $GITHUB_OUTPUT
          echo "Parsed status=$STATUS simulation_enabled=$SIM"

      - name: Post bundle to daily Issue (YELLOW/RED only)
        if: steps.check-secrets.outputs.has_secrets == 'true' && (steps.bundle.outputs.status == 'YELLOW' || steps.bundle.outputs.status == 'RED')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const simulationEnabled = process.env.SIMULATION_ENABLED === 'true';

            const workspace = process.env.GITHUB_WORKSPACE;
            const bundlesDir = path.join(workspace, 'ops/bundles');
            const promptPath = path.join(workspace, 'ops/observability/COENGINEER_PROMPT.md');

            const mdFiles = fs.readdirSync(bundlesDir)
              .filter(f => f.endsWith('-bundle.md'))
              .sort()
              .reverse();
            if (mdFiles.length === 0) {
              core.setFailed('No *-bundle.md file found in ops/bundles');
              return;
            }
            const latestMd = mdFiles[0];
            let bundleMd = fs.readFileSync(path.join(bundlesDir, latestMd), 'utf8');
            const maxCommentLen = 55000;
            if (bundleMd.length > maxCommentLen) {
              bundleMd = bundleMd.slice(0, maxCommentLen) + '\n\n---\n*(Bundle truncated; download the workflow artifact for the full file.)*';
            }

            const today = new Date().toISOString().slice(0, 10);
            const issueTitle = `TalkBack Observability - ${today}`;

            let promptBody = '';
            try {
              promptBody = fs.readFileSync(promptPath, 'utf8');
            } catch (e) {
              promptBody = '*(COENGINEER_PROMPT.md not found)*';
            }

            const intro = `## How to use this\n\nPaste the **latest comment** (bundle) + the co-engineer prompt below into Cursor or ChatGPT for analysis.\n\n**Loop:** Run → Bundle → Inbox (YELLOW/RED only) → AI analysis → Fix → Next run verifies.\n\n---\n\n`;
            const bundleSection = '\n\n---\n\n### Latest bundle (markdown)\n\n```\n' + bundleMd + '\n```';
            const maxBodyLen = 62000;
            let fullBody = intro + '### Co-engineer prompt template\n\n' + promptBody + bundleSection;
            if (fullBody.length > maxBodyLen) {
              fullBody = fullBody.slice(0, maxBodyLen) + '\n\n*(Body truncated; see workflow artifacts for full bundle.)*';
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => i.title === issueTitle);

            let commentBody = `### Bundle \`${latestMd}\` (run ${context.runId})\n\n`;
            if (simulationEnabled) {
              commentBody = `⚠️ **SIMULATION MODE — NOT A REAL INCIDENT**\n\n` + commentBody;
            }
            commentBody += `<details>\n<summary>Markdown bundle</summary>\n\n\`\`\`md\n${bundleMd}\n\`\`\`\n\n</details>\n\n*Artifact: \`talkback-observability-bundle-${context.runId}\`*`;

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody
              });
              core.notice(`Updated issue #${existing.number} with new bundle comment (status was YELLOW/RED)`);
            } else {
              const labels = ['observability', 'agent'];
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body: fullBody,
                  labels
                });
              } catch (e) {
                if (e.message && e.message.includes('Validation Failed') && e.message.includes('label')) {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: issueTitle,
                    body: fullBody
                  });
                } else {
                  throw e;
                }
              }
              core.notice(`Created new issue: ${issueTitle}`);
            }
        env:
          SIMULATION_ENABLED: ${{ steps.bundle.outputs.simulation_enabled }}

      - name: Skip issue (GREEN)
        if: steps.check-secrets.outputs.has_secrets == 'true' && steps.bundle.outputs.status == 'GREEN'
        run: echo "Skipping issue update because status=GREEN (artifacts uploaded)"
