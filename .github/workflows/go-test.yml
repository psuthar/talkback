# Continuous Go integration tests against PostgreSQL (strict gate; fails the workflow on failure).
# For release readiness scoring and artifacts, see release-readiness.yml.
name: Go test (PostgreSQL)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talkback
          POSTGRES_PASSWORD: talkback
          POSTGRES_DB: talkback
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          DATABASE_URL: postgres://talkback:talkback@localhost:5432/talkback?sslmode=disable
        run: go test ./...
