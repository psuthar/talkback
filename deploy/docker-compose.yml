services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talkback-postgres
    environment:
      POSTGRES_USER: talkback
      POSTGRES_PASSWORD: talkback
      POSTGRES_DB: talkback
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkback"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API (optional): use for local debugging when slide conversion (LibreOffice) is needed.
  # Run from repo root: docker compose -f deploy/docker-compose.yml up -d postgres && docker compose -f deploy/docker-compose.yml up --build api
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: talkback-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://talkback:talkback@postgres:5432/talkback?sslmode=disable"
      RUN_MIGRATIONS: "true"
      # Upload root in container; sessions dir mounted from host so PPT uploads + soffice conversion work
      TALKBACK_UPLOAD_ROOT: "/data"
    ports:
      - "8080:8080"
    volumes:
      - ../sessions:/data/sessions

volumes:
  postgres_data:

