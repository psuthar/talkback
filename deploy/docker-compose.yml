services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talkback-postgres
    environment:
      POSTGRES_USER: talkback
      POSTGRES_PASSWORD: talkback
      POSTGRES_DB: talkback
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkback"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

