# Example Kubernetes resources for talkback-mcp (SCRUM-42, SCRUM-69). Placeholders only — do not commit real secrets.
# Apply after editing: kubectl apply -f mcp-hosted.example.yaml
#
# Stdio MCP (JSON-RPC on stdin/stdout) remains the wire protocol for MCP clients. For probes and
# orchestration without a stdio bridge, set TALKBACK_MCP_HEALTH_ADDR so GET /healthz and /ready respond.
---
apiVersion: v1
kind: Secret
metadata:
  name: talkback-mcp
  labels:
    app.kubernetes.io/name: talkback-mcp
type: Opaque
stringData:
  # Required. Comma-separated rotation keys supported.
  TALKBACK_MCP_API_KEY: "REPLACE_WITH_SECRET_FROM_VAULT_OR_SEALED_SECRET"
  # Optional: add TALKBACK_MCP_ACTING_USER_ID here (users.id UUID) when using get_session_metadata.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: talkback-mcp-config
  labels:
    app.kubernetes.io/name: talkback-mcp
data:
  # Hosted deployments should use TALKBACK_MCP_REQUIRE_CLIENT_KEY=true and pass keys per tools/call.
  TALKBACK_MCP_REQUIRE_CLIENT_KEY: "true"
  # Optional: set if you register get_session_metadata (same Postgres as TalkBack app).
  # Prefer a Secret if the URL contains a password — use stringData in a separate Secret instead.
  DATABASE_URL: ""
  # HTTP probes (liveness/readiness) — listen on all interfaces inside the pod.
  TALKBACK_MCP_HEALTH_ADDR: ":8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talkback-mcp
  labels:
    app.kubernetes.io/name: talkback-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: talkback-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talkback-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: talkback-mcp
          image: talkback-mcp:latest
          imagePullPolicy: IfNotPresent
          args: ["-version=1.0.0"]
          envFrom:
            - secretRef:
                name: talkback-mcp
            - configMapRef:
                name: talkback-mcp-config
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
