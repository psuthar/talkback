# Render Blueprint: TalkBack API (optional reset on deploy)
# See README "Reset database and deploy on Render" for when to set RENDER_RESET_DB_ON_RELEASE.
# Link a Render Postgres in the dashboard and set DATABASE_URL (or use envVar fromDatabase).
services:
  - type: web
    name: talkback-api
    runtime: docker
    preDeployCommand: sh -c 'if [ -n "$RENDER_RESET_DB_ON_RELEASE" ]; then /reset-db; fi'
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      # R2 storage (stops "video presign and file artifacts will return 503"). Also set in Dashboard:
      # R2_BUCKET, R2_ACCOUNT_ID, R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, PUBLIC_APP_ORIGIN
      - key: STORAGE_DRIVER
        value: r2
      - key: R2_REGION
        value: auto
      - key: R2_PREFIX
        value: talkback/
      - key: R2_PRESIGN_PUT_TTL_SECONDS
        value: "900"
      - key: R2_PRESIGN_GET_TTL_SECONDS
        value: "3600"
      # Add in Dashboard: DATABASE_URL, CORS_ALLOWED_ORIGINS, BASE_URL, OPENAI_API_KEY, and R2_* above
