# TalkBack release-readiness risk model (v1)
# Deterministic rules only — no LLM scoring. Extend with New Relic / deployment hooks later.

version: 1

# Core workflow validations (must be evidenced by smoke and/or E2E artifacts when relevant areas change)
validations:
  auth_session:
    description: "Login/session and creator access"
  upload_extraction:
    description: "Material upload and text extraction pipeline"
  nav_assets:
    description: "Materials tree / asset selection in left nav"
  viewer_materials:
    description: "Viewer renders uploaded materials"
  qa_rag:
    description: "Q&A and answer generation with citations"
  orchestration:
    description: "Creator orchestration recommendations and draft approval/rejection flows"

# Map changed paths → risk categories (first match wins per file; a file can trigger multiple via multiple rules)
risk_from_paths:
  - categories: [auth_session]
    patterns:
      - "internal/auth/**"
      - "internal/handlers/*login*"
      - "internal/handlers/sessions.go"
      - "internal/handlers/session_invite.go"
      - "internal/handlers/session_participant.go"
      - "internal/invitations/**"
      - "internal/database/*user*"
      - "internal/database/sessions.go"
      - "internal/database/session_invitations.go"
      - "internal/database/session_memberships.go"
      - "internal/database/*login*"
  - categories: [upload_extraction]
    patterns:
      - "internal/handlers/session_materials.go"
      - "internal/handlers/session_import.go"
      - "internal/handlers/session_import_teams.go"
      - "internal/processing/**"
      - "internal/utils/job_processor.go"
      - "internal/database/session_processing_jobs.go"
      - "internal/database/session_chunks.go"
      - "internal/transcript/**"
      - "internal/rag/**"
  - categories: [nav_assets, viewer_materials]
    patterns:
      - "web/src/components/MaterialsTreePanel*"
      - "web/src/components/SlideDeckViewer*"
      - "web/src/components/Artifact*"
  - categories: [viewer_materials]
    patterns:
      - "web/src/modes/CreatorMode*"
      - "web/src/modes/ParticipantMode*"
  - categories: [qa_rag]
    patterns:
      - "internal/handlers/session_ask.go"
      - "internal/rag/**"
      - "internal/handlers/*question*"
  - categories: [orchestration]
    patterns:
      - "internal/orchestration/**"
      - "internal/handlers/session_orchestration*.go"
      - "internal/database/orchestration_recommendations.go"
      - "web/src/modes/CreatorMode*"
  - categories: [migrations]
    patterns:
      - "db/migrations/**"
      - "internal/migrations/**"

# When these path patterns change, warn unless `config_validation_note` is set in evidence (see script)
risky_config_patterns:
  - ".github/workflows/**"
  - "deploy/**"
  - "Dockerfile"
  - "**/render.yaml"
  - "go.mod"

# When smoke/E2E report overall PASS, infer these validations (deterministic; CI can override with explicit false in JSON).
infer_validations_when_pass:
  smoke:
    - auth_session
    - upload_extraction
    - qa_rag
    - orchestration
  e2e:
    - auth_session
    - nav_assets
    - viewer_materials
    - qa_rag
    - orchestration

scoring:
  max_score: 100
  pass_threshold: 85
  warn_threshold: 60
  penalties:
    missing_smoke_artifact: 25
    missing_e2e_artifact: 15
    missing_coverage_artifact: 5
    missing_prod_health_artifact: 5
    non_critical_e2e_failure: 15
    e2e_retries_or_flaky: 10
    coverage_regression: 12
    risky_config_without_note: 10
  block_score: 0

# Deterministic remediation guidance, keyed by failed_check identifier.
# Used by the readiness script to populate the remediation section of reports.
# Fields: severity (block|warn), likely_cause, recommended_action, fix_type (code|test|config|process|infra|db)
remediation:
  smoke_artifact:
    severity: warn
    likely_cause: "Smoke test job did not run or failed to upload results"
    recommended_action: "Check the go-test job logs; re-run the workflow if transient"
    fix_type: process
  smoke_parse_error:
    severity: block
    likely_cause: "smoke_results.json was written but contains invalid JSON"
    recommended_action: "Inspect the 'Write smoke_results.json' step output in CI"
    fix_type: process
  smoke_failed:
    severity: block
    likely_cause: "One or more Go tests failed"
    recommended_action: "Run 'go test ./...' locally and fix the failing tests before merge"
    fix_type: code
  e2e_artifact:
    severity: warn
    likely_cause: "Playwright did not produce output or the e2e_to_readiness converter step failed"
    recommended_action: "Check the Playwright and converter step logs; re-run if transient"
    fix_type: process
  e2e_skipped:
    severity: warn
    likely_cause: "E2E step was explicitly skipped or timed out before producing results"
    recommended_action: "Investigate why Playwright was skipped; re-run or mark as known flake if intentional"
    fix_type: process
  e2e_critical:
    severity: block
    likely_cause: "A test matching a critical name pattern (auth/login/session/upload/material/invite) failed"
    recommended_action: "Run 'npx playwright test' locally targeting the failing spec and fix before merge"
    fix_type: test
  e2e_non_critical:
    severity: warn
    likely_cause: "Non-critical E2E tests failed (does not match critical name patterns)"
    recommended_action: "Investigate failing specs; fix or document as a known flake if intentional"
    fix_type: test
  e2e_retries:
    severity: warn
    likely_cause: "Playwright retried tests — indicates flakiness or timing issues in the test suite"
    recommended_action: "Add explicit waits or stability guards to the affected test; investigate root cause"
    fix_type: test
  coverage_regression:
    severity: warn
    likely_cause: "New code was added without corresponding tests, lowering line coverage"
    recommended_action: "Add unit tests for the changed area; verify with 'go test -cover ./...'"
    fix_type: test
  risky_config_without_note:
    severity: warn
    likely_cause: "A workflow, Dockerfile, or deploy config file changed without a Validation: commit note"
    recommended_action: "Add 'Validation: <what you tested>' to a commit message in this branch"
    fix_type: process
  risk_without_validation:
    severity: block
    likely_cause: "Changed paths triggered a risk category but required validation evidence is missing from smoke/E2E results"
    recommended_action: "Ensure the relevant smoke and E2E tests ran and passed for the affected area; check infer_validations_when_pass in config.yaml"
    fix_type: test
  pr_risk_block:
    severity: block
    likely_cause: "PR Risk indicates a merge block (elevated risk or incomplete evidence)"
    recommended_action: "Resolve PR Risk required items before deploy; use pr_risk.md as the detailed checklist"
    fix_type: process
  pr_risk_warn:
    severity: warn
    likely_cause: "PR Risk indicates elevated review may be needed (churn, config/workflow changes, or evidence gaps)"
    recommended_action: "Complete PR Risk validations before deploy; use pr_risk.md for the full validation list"
    fix_type: process

# E2E failure severity: tests matching these name substrings are "critical" for blocking
e2e_critical_name_patterns:
  - "auth"
  - "login"
  - "session"
  - "upload"
  - "material"
  - "invite"
